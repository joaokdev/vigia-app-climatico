<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d10">
  <meta name="color-scheme" content="dark">
  <meta
    name="description"
    content="Vault — How strong is that password, really? An animated password strength visualizer by Code Candy."
  >
  <title>Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Page shell -->
  <div class="page">
    <div class="page-glow" aria-hidden="true"></div>

    <div class="app" id="vault-app">
      <main class="main">

        <!-- Password field + strength scene -->
        <section class="password-section" aria-labelledby="password-label">
          <h1 class="sr-only">Vault — How strong is that password, really?</h1>

          <div class="password-meta">
            <label class="password-label" id="password-label" for="password-input">Password</label>
            <button type="button" class="suggest-btn" id="suggest-btn">Suggest strong</button>
          </div>

          <div class="password-field" id="password-field">
            <input
              class="password-input"
              id="password-input"
              type="password"
              name="vault-password"
              placeholder="Start typing..."
              autocomplete="new-password"
              spellcheck="false"
              autocapitalize="off"
              aria-describedby="strength-live"
            >
            <button
              type="button"
              class="visibility-btn"
              id="visibility-btn"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg class="visibility-icon visibility-icon--eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.2 12S5.5 5.5 12 5.5 21.8 12 21.8 12 18.5 18.5 12 18.5 2.2 12 2.2 12Z"
                />
                <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7" />
              </svg>
              <svg class="visibility-icon visibility-icon--off" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 3l18 18M9.9 9.9A3.2 3.2 0 0 0 12 15.2a3.2 3.2 0 0 0 2.1-.8M6.1 6.3C4.1 7.6 2.6 9.5 2.2 12S5.5 18.5 12 18.5c1.7 0 3.2-.3 4.5-.8M10.6 5.7A10 10 0 0 1 12 5.5C18.5 5.5 21.8 12 21.8 12a11.5 11.5 0 0 1-2.4 3.2"
                />
              </svg>
            </button>
          </div>

          <!-- Strength card: SVG lock progression + feedback copy -->
          <div class="strength-card" id="strength-card" data-tier="0">
            <div class="strength-visual" aria-hidden="true">
              <svg
                class="vault-svg"
                id="vault-svg"
                viewBox="150 150 260 260"
                xmlns="http://www.w3.org/2000/svg"
                focusable="false"
              >
                  <defs>
                    <linearGradient id="metal-silver" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#d8dce6" />
                      <stop offset="45%" stop-color="#9aa3b5" />
                      <stop offset="100%" stop-color="#6b7384" />
                    </linearGradient>
                    <linearGradient id="metal-gold" x1="0%" y1="0%" x2="0%" y2="100%">
                      <stop offset="0%" stop-color="#f5e087" />
                      <stop offset="40%" stop-color="#d4a84b" />
                      <stop offset="100%" stop-color="#9a6b24" />
                    </linearGradient>
                    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#8b93a5" />
                      <stop offset="50%" stop-color="#4a5160" />
                      <stop offset="100%" stop-color="#2a2f3a" />
                    </linearGradient>
                    <linearGradient id="vault-face" x1="30%" y1="0%" x2="70%" y2="100%">
                      <stop offset="0%" stop-color="#6a7284" />
                      <stop offset="50%" stop-color="#3a404e" />
                      <stop offset="100%" stop-color="#1e222c" />
                    </linearGradient>
                    <radialGradient id="hub-glow" cx="50%" cy="45%" r="55%">
                      <stop offset="0%" stop-color="#5a6478" />
                      <stop offset="70%" stop-color="#2c313c" />
                      <stop offset="100%" stop-color="#161920" />
                    </radialGradient>
                    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
                      <feGaussianBlur stdDeviation="2.2" result="b" />
                      <feMerge>
                        <feMergeNode in="b" />
                        <feMergeNode in="SourceGraphic" />
                      </feMerge>
                    </filter>
                  </defs>

                  <!-- EMPTY / open doorway -->
                  <g id="vv-empty" class="vv-empty">
                    <!-- Floor shadow through opening -->
                    <ellipse
                      cx="278"
                      cy="352"
                      rx="48"
                      ry="8"
                      fill="#000"
                      opacity="0.35"
                    />
                    <!-- Door frame -->
                    <path
                      d="M228 348
                         V212
                         c0-10 8-18 18-18
                         h88
                         c10 0 18 8 18 18
                         V348"
                      fill="none"
                      stroke="#4a5160"
                      stroke-width="10"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                    <path
                      d="M228 348
                         V212
                         c0-10 8-18 18-18
                         h88
                         c10 0 18 8 18 18
                         V348"
                      fill="none"
                      stroke="#6b7384"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      opacity="0.55"
                    />
                    <!-- Empty opening (dark void) -->
                    <path
                      d="M240 340
                         V218
                         c0-4 3-7 7-7
                         h66
                         c4 0 7 3 7 7
                         V340
                         Z"
                      fill="#0a0a0e"
                      opacity="0.55"
                    />
                    <!-- Soft depth lines in the void -->
                    <path
                      d="M255 230 v95 M280 225 v105 M305 230 v95"
                      stroke="#2a2f3a"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      opacity="0.7"
                    />
                    <!-- Door leaf swung open to the right -->
                    <g id="vv-open-door">
                      <path
                        d="M334 204
                           L392 218
                           L392 358
                           L334 348
                           Z"
                        fill="#2a2f3a"
                        stroke="#5c6474"
                        stroke-width="2"
                        stroke-linejoin="round"
                      />
                      <!-- Door panel inset -->
                      <path
                        d="M344 228
                           L380 236
                           L380 330
                           L344 322
                           Z"
                        fill="none"
                        stroke="#3a3f4c"
                        stroke-width="1.5"
                        opacity="0.9"
                      />
                      <!-- Door edge highlight -->
                      <path
                        d="M334 204 L334 348"
                        stroke="#8b93a5"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        opacity="0.45"
                      />
                      <!-- Handle on open door -->
                      <circle cx="372" cy="286" r="4.5" fill="#6b7384" />
                      <circle cx="372" cy="286" r="2" fill="#9aa3b5" />
                    </g>
                    <!-- Empty strike plate / missing lock on frame -->
                    <rect
                      x="318"
                      y="274"
                      width="8"
                      height="14"
                      rx="1.5"
                      fill="#3a3f4c"
                      opacity="0.8"
                    />
                    <circle cx="322" cy="281" r="1.8" fill="#1a1d24" />
                  </g>

                  <!-- PAPERCLIP -->
                  <g id="vv-paperclip" class="vv-paperclip">
                    <path
                      id="vv-clip-path"
                      d="M248 245
                         c0-18 14-32 32-32
                         s32 14 32 32
                         v78
                         c0 28-22 48-48 48
                         s-48-20-48-48
                         v-62
                         c0-14 11-26 26-26
                         s26 12 26 26
                         v48
                         c0 8-6 14-14 14
                         s-14-6-14-14
                         v-36"
                      fill="none"
                      stroke="url(#metal-silver)"
                      stroke-width="7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                    <path
                      d="M248 245
                         c0-18 14-32 32-32
                         s32 14 32 32
                         v78
                         c0 28-22 48-48 48
                         s-48-20-48-48
                         v-62
                         c0-14 11-26 26-26
                         s26 12 26 26
                         v48
                         c0 8-6 14-14 14
                         s-14-6-14-14
                         v-36"
                      fill="none"
                      stroke="#ffffff"
                      stroke-width="1.4"
                      stroke-linecap="round"
                      opacity="0.28"
                      transform="translate(-1.5 -1.5)"
                    />
                  </g>

                  <!-- PADLOCK -->
                  <g id="vv-padlock" class="vv-padlock">
                    <path
                      id="vv-pad-shackle"
                      d="M236 268
                         v-28
                         c0-24 19-44 44-44
                         s44 20 44 44
                         v28"
                      fill="none"
                      stroke="url(#metal-silver)"
                      stroke-width="14"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                    <path
                      d="M236 268 v-28 c0-24 19-44 44-44 s44 20 44 44 v28"
                      fill="none"
                      stroke="#fff"
                      stroke-width="2"
                      stroke-linecap="round"
                      opacity="0.22"
                      transform="translate(-2 -2)"
                    />
                    <rect
                      id="vv-pad-body"
                      x="222"
                      y="262"
                      width="116"
                      height="100"
                      rx="16"
                      fill="url(#metal-gold)"
                    />
                    <rect
                      id="vv-pad-face"
                      x="230"
                      y="270"
                      width="100"
                      height="84"
                      rx="12"
                      fill="#c4923a"
                      opacity="0.35"
                    />
                    <g id="vv-pad-keyhole">
                      <circle cx="280" cy="308" r="11" fill="#2a1f0e" />
                      <rect x="275.5" y="312" width="9" height="22" rx="3" fill="#2a1f0e" />
                    </g>
                  </g>

                  <!-- DEADBOLT -->
                  <g id="vv-deadbolt" class="vv-deadbolt">
                    <circle
                      id="vv-dead-outer"
                      cx="280"
                      cy="280"
                      r="78"
                      fill="url(#metal-dark)"
                      stroke="#9aa3b5"
                      stroke-width="3"
                    />
                    <circle
                      id="vv-dead-ring"
                      cx="280"
                      cy="280"
                      r="62"
                      fill="none"
                      stroke="#c5ccd8"
                      stroke-width="5"
                      opacity="0.55"
                    />
                    <circle
                      id="vv-dead-inner"
                      cx="280"
                      cy="280"
                      r="44"
                      fill="#2a2f3a"
                      stroke="#6b7384"
                      stroke-width="2"
                    />
                    <circle
                      id="vv-dead-cylinder"
                      cx="280"
                      cy="280"
                      r="26"
                      fill="url(#metal-silver)"
                      stroke="#dfe3ec"
                      stroke-width="1.5"
                    />
                    <rect
                      id="vv-dead-slot"
                      x="276"
                      y="262"
                      width="8"
                      height="36"
                      rx="2.5"
                      fill="#1a1d24"
                    />
                    <!-- mechanical bolt stubs -->
                    <rect class="vv-dead-bolt" x="268" y="198" width="24" height="14" rx="3" fill="#8b93a5" />
                    <rect class="vv-dead-bolt" x="268" y="348" width="24" height="14" rx="3" fill="#8b93a5" />
                    <rect class="vv-dead-bolt" x="198" y="268" width="14" height="24" rx="3" fill="#8b93a5" />
                    <rect class="vv-dead-bolt" x="348" y="268" width="14" height="24" rx="3" fill="#8b93a5" />
                  </g>

                  <!-- BANK VAULT -->
                  <g id="vv-vault" class="vv-vault">
                    <circle
                      id="vv-vault-outer"
                      cx="280"
                      cy="280"
                      r="92"
                      fill="url(#metal-dark)"
                      stroke="#a8b0c0"
                      stroke-width="4"
                    />
                    <circle
                      cx="280"
                      cy="280"
                      r="86"
                      fill="none"
                      stroke="#3dff8a"
                      stroke-width="1.5"
                      opacity="0.22"
                      class="vv-vault-accent"
                    />
                    <circle
                      id="vv-vault-mid"
                      cx="280"
                      cy="280"
                      r="72"
                      fill="none"
                      stroke="#7a8498"
                      stroke-width="6"
                    />
                    <circle
                      id="vv-vault-groove"
                      cx="280"
                      cy="280"
                      r="64"
                      fill="none"
                      stroke="#2a2f3a"
                      stroke-width="3"
                    />
                    <circle
                      id="vv-vault-door"
                      cx="280"
                      cy="280"
                      r="56"
                      fill="url(#vault-face)"
                      stroke="#6b7384"
                      stroke-width="2"
                    />
                    <!-- locking bolts around perimeter -->
                    <g id="vv-vault-bolts">
                      <rect class="vv-vault-bolt" x="272" y="178" width="16" height="22" rx="3" fill="#b8c0d0" />
                      <rect class="vv-vault-bolt" x="272" y="360" width="16" height="22" rx="3" fill="#b8c0d0" />
                      <rect class="vv-vault-bolt" x="178" y="272" width="22" height="16" rx="3" fill="#b8c0d0" />
                      <rect class="vv-vault-bolt" x="360" y="272" width="22" height="16" rx="3" fill="#b8c0d0" />
                      <rect class="vv-vault-bolt" x="214" y="204" width="16" height="20" rx="3" fill="#9aa3b5" transform="rotate(-45 222 214)" />
                      <rect class="vv-vault-bolt" x="330" y="204" width="16" height="20" rx="3" fill="#9aa3b5" transform="rotate(45 338 214)" />
                      <rect class="vv-vault-bolt" x="214" y="336" width="16" height="20" rx="3" fill="#9aa3b5" transform="rotate(45 222 346)" />
                      <rect class="vv-vault-bolt" x="330" y="336" width="16" height="20" rx="3" fill="#9aa3b5" transform="rotate(-45 338 346)" />
                    </g>
                    <!-- spokes / locking wheel -->
                    <g id="vv-vault-spokes">
                      <line x1="280" y1="232" x2="280" y2="256" stroke="#c5ccd8" stroke-width="5" stroke-linecap="round" />
                      <line x1="280" y1="304" x2="280" y2="328" stroke="#c5ccd8" stroke-width="5" stroke-linecap="round" />
                      <line x1="232" y1="280" x2="256" y2="280" stroke="#c5ccd8" stroke-width="5" stroke-linecap="round" />
                      <line x1="304" y1="280" x2="328" y2="280" stroke="#c5ccd8" stroke-width="5" stroke-linecap="round" />
                      <line x1="248" y1="248" x2="264" y2="264" stroke="#9aa3b5" stroke-width="4" stroke-linecap="round" />
                      <line x1="312" y1="248" x2="296" y2="264" stroke="#9aa3b5" stroke-width="4" stroke-linecap="round" />
                      <line x1="248" y1="312" x2="264" y2="296" stroke="#9aa3b5" stroke-width="4" stroke-linecap="round" />
                      <line x1="312" y1="312" x2="296" y2="296" stroke="#9aa3b5" stroke-width="4" stroke-linecap="round" />
                    </g>
                    <circle
                      id="vv-vault-hub"
                      cx="280"
                      cy="280"
                      r="22"
                      fill="url(#hub-glow)"
                      stroke="#d0d6e2"
                      stroke-width="2.5"
                    />
                    <circle cx="280" cy="280" r="10" fill="#1a1d24" stroke="#3dff8a" stroke-width="1.5" class="vv-vault-accent" />
                    <circle cx="280" cy="280" r="4" fill="#3dff8a" class="vv-vault-accent" opacity="0.85" filter="url(#soft-glow)" />
                  </g>
                </svg>
              </div>

            <div class="strength-feedback" id="strength-feedback">
              <p class="strength-title" id="strength-title">No lock at all</p>
              <p class="strength-message" id="strength-message">The door is standing open.</p>
              <p class="strength-entropy" id="strength-entropy">
                <span id="entropy-value">0</span> bits of entropy
              </p>
            </div>
          </div>

          <p class="sr-only" id="strength-live" aria-live="polite"></p>
        </section>
      </main>
    </div>
  </div>

  <noscript>Vault needs JavaScript enabled (and GSAP from the CDN) to score passwords and animate the lock.</noscript>

  <!-- GSAP first, then Vault modules, then app shell -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="js/entropy.js"></script>
  <script src="js/crackTime.js"></script>
  <script src="js/tiers.js"></script>
  <script src="js/suggest.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="script.js"></script>
</body>
</html>
